# Альтернатива `npm run db:local`: Postgres в Docker.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: litmob
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
